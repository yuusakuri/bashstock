name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
        with:
          submodules: recursive

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install perl shellcheck

      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libtime-hires-perl perl shellcheck

      - name: Verify the time provider
        run: perl -MTime::HiRes -MPOSIX -e 1

      - name: Run all checks
        run: just verify

      - name: Upload the distribution
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7.0.1
        with:
          name: bashstock-${{ github.sha }}
          path: dist/bashstock.tar.gz
          if-no-files-found: error

  check-fedora:
    name: Check on Fedora 44
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: fedora:44

    steps:
      - name: Install dependencies
        run: dnf install --assumeyes git glibc-langpack-en perl perl-JSON-PP perl-POSIX perl-Time-HiRes ShellCheck

      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
        with:
          submodules: recursive

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Trust the checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify the UTF-8 locale
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: test "$(locale charmap)" = "UTF-8"

      - name: Run all checks
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: just verify
