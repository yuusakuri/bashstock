name: Installer integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request supersedes the checks of its earlier commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Installers query the GitHub API; the workflow token avoids the limit for shared runner addresses.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  docker-packages:
    name: Docker, languages, editors, browsers, and tools on ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        image:
          - ubuntu:18.04
          - ubuntu:20.04
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
          - fedora:34
          - fedora:43
          - fedora:44
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
        with:
          submodules: recursive
      - name: Build the standalone library
        run: ./scripts/build
      - name: Verify Docker, languages, editors, browsers, and tools installations
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} -e GITHUB_TOKEN \
            -v "$PWD/dist/bashstock.sh:/opt/bashstock.sh:ro" \
            -v "$PWD/scripts/test-docker-package-container:/opt/test-docker-package-container:ro" \
            -v "$PWD/scripts/test-node-container:/opt/test-node-container:ro" \
            -v "$PWD/scripts/test-jdk-go-container:/opt/test-jdk-go-container:ro" \
            -v "$PWD/scripts/test-rust-container:/opt/test-rust-container:ro" \
            -v "$PWD/scripts/test-ruby-container:/opt/test-ruby-container:ro" \
            -v "$PWD/scripts/test-pipx-container:/opt/test-pipx-container:ro" \
            -v "$PWD/scripts/test-vscode-container:/opt/test-vscode-container:ro" \
            -v "$PWD/scripts/test-tools-container:/opt/test-tools-container:ro" \
            -v "$PWD/scripts/test-browsers-container:/opt/test-browsers-container:ro" \
            "${{ matrix.image }}" bash -c \
            'bash /opt/test-docker-package-container && bash /opt/test-node-container && bash /opt/test-jdk-go-container && bash /opt/test-rust-container && bash /opt/test-ruby-container && bash /opt/test-pipx-container && bash /opt/test-vscode-container && bash /opt/test-browsers-container && bash /opt/test-tools-container'

  flutter:
    name: Flutter on ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        image:
          - ubuntu:18.04
          - ubuntu:20.04
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
          - fedora:34
          - fedora:43
          - fedora:44
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
        with:
          submodules: recursive
      - name: Build the standalone library
        run: ./scripts/build
      - name: Install Flutter, switch versions, and build and start a Linux application
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} -e GITHUB_TOKEN \
            -v "$PWD/dist/bashstock.sh:/opt/bashstock.sh:ro" \
            -v "$PWD/scripts/test-flutter-container:/opt/test-flutter-container:ro" \
            "${{ matrix.image }}" bash /opt/test-flutter-container

  claude-desktop:
    name: Claude Desktop on ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        image:
          - ubuntu:20.04
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
        with:
          submodules: recursive
      - name: Build the standalone library
        run: ./scripts/build
      - name: Verify Claude Desktop installation from Anthropic's APT repository
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} -e GITHUB_TOKEN \
            -v "$PWD/dist/bashstock.sh:/opt/bashstock.sh:ro" \
            -v "$PWD/scripts/test-claude-desktop-container:/opt/test-claude-desktop-container:ro" \
            "${{ matrix.image }}" bash /opt/test-claude-desktop-container

  dns:
    name: DNS switching on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
        with:
          submodules: recursive
      - name: Build the standalone library
        run: ./scripts/build
      - name: Refuse to change DNS when the manager is unknown
        run: |
          docker run --rm -e GITHUB_TOKEN -v "$PWD/dist/bashstock.sh:/opt/bashstock.sh:ro" ubuntu:24.04 bash -c '
            set -u
            source /opt/bashstock.sh
            [[ "$(net::dns::manager)" == unknown ]]
            status=0
            net::dns::use-google || status="$?"
            [[ "$status" -eq 69 ]]
            [[ ! -e /etc/systemd/resolved.conf.d/90-bashstock-google.conf ]]'
      - name: Switch between systemd-resolved and NetworkManager and use Google Public DNS
        shell: bash
        run: bash ./scripts/test-dns-host

  tools-host:
    name: OpenSSH, Supabase, Ubuntu ISO, and QMK on ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
        with:
          submodules: recursive
      - name: Build the standalone library
        run: ./scripts/build
      - name: Verify the SSH server, the Supabase local stack, and the ISO checksum
        shell: bash
        run: bash ./scripts/test-tools-host

  docker-service:
    name: Docker service on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
        with:
          submodules: recursive
      - name: Build the standalone library
        run: ./scripts/build
      - name: Verify Docker installation, service, and a container
        shell: bash
        run: bash ./scripts/test-docker-host

  docker-service-container:
    name: Docker service with systemd on ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        image:
          - ubuntu:18.04
          - ubuntu:20.04
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
          - fedora:34
          - fedora:43
          - fedora:44
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
        with:
          submodules: recursive
      - name: Build the standalone library
        run: ./scripts/build
      - name: Boot a privileged container whose PID 1 is systemd
        run: |
          # Docker and containerd keep their data on volumes because overlayfs cannot stack on the container's own root.
          docker run -d --name bashstock --privileged --cgroupns=host \
            --platform linux/${{ matrix.arch }} \
            --tmpfs /run --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v bashstock-docker:/var/lib/docker \
            -v bashstock-containerd:/var/lib/containerd \
            -v "$PWD/dist/bashstock.sh:/opt/bashstock.sh:ro" \
            -v "$PWD/scripts/boot-systemd-container:/opt/boot-systemd-container:ro" \
            -v "$PWD/scripts/test-docker-service-container:/opt/test-docker-service-container:ro" \
            "${{ matrix.image }}" bash /opt/boot-systemd-container
          for _ in $(seq 1 300); do
            [[ "$(docker inspect -f '{{.State.Running}}' bashstock)" == true ]] || { docker logs bashstock; exit 1; }
            state="$(docker exec bashstock systemctl is-system-running 2>/dev/null || true)"
            case "$state" in
              running | degraded) break ;;
            esac
            sleep 2
          done
          printf 'systemd state: %s\n' "$state"
          [[ "$state" == running || "$state" == degraded ]]
      - name: Install Docker, start the service, and run a container as a regular user
        run: |
          docker exec -u tester -w /home/tester -e GITHUB_TOKEN bashstock \
            bash /opt/test-docker-service-container
      - name: Show the container log
        if: failure()
        run: |
          docker logs bashstock 2>&1 | tail -n 100
          docker exec bashstock systemctl --failed --no-pager || true
          docker exec bashstock journalctl -u docker --no-pager -n 100 || true

  ubuntu-setup:
    name: Ubuntu user and desktop setup on ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        image:
          - ubuntu:18.04
          - ubuntu:20.04
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
        with:
          submodules: recursive
      - name: Build the standalone library
        run: ./scripts/build
      - name: Boot a privileged container whose PID 1 is systemd
        run: |
          docker run -d --name bashstock --privileged --cgroupns=host \
            --platform linux/${{ matrix.arch }} \
            --tmpfs /run --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD/dist/bashstock.sh:/opt/bashstock.sh:ro" \
            -v "$PWD/scripts/boot-systemd-container:/opt/boot-systemd-container:ro" \
            -v "$PWD/scripts/test-ubuntu-setup-container:/opt/test-ubuntu-setup-container:ro" \
            -v "$PWD/scripts/test-ubuntu-desktop-container:/opt/test-ubuntu-desktop-container:ro" \
            "${{ matrix.image }}" bash /opt/boot-systemd-container
          for _ in $(seq 1 300); do
            [[ "$(docker inspect -f '{{.State.Running}}' bashstock)" == true ]] || { docker logs bashstock; exit 1; }
            state="$(docker exec bashstock systemctl is-system-running 2>/dev/null || true)"
            case "$state" in
              running | degraded) break ;;
            esac
            sleep 2
          done
          printf 'systemd state: %s\n' "$state"
          [[ "$state" == running || "$state" == degraded ]]
      - name: Apply ubuntu::setup twice and check a new login session
        run: |
          docker exec -u tester -w /home/tester bashstock bash /opt/test-ubuntu-setup-container
      - name: Apply the desktop setup and read the settings back in a new D-Bus session
        run: |
          docker exec -u tester -w /home/tester bashstock bash /opt/test-ubuntu-desktop-container

  android-macos:
    name: Android SDK and AVD on macOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
        with:
          submodules: recursive
      - name: Build the standalone library
        run: ./scripts/build
      - name: Verify SDK components and AVD lifecycle
        shell: bash
        run: bash ./scripts/test-android-macos

  macos-setup:
    name: macOS setup on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - macos-15-intel
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
        with:
          submodules: recursive
      - name: Build the standalone library
        run: ./scripts/build
      - name: Run mac::setup twice and check the settings, applications, and tools
        shell: bash
        run: bash ./scripts/test-macos-setup

  android-linux:
    name: Android SDK and AVD on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
        with:
          submodules: recursive
      - name: Build the standalone library
        run: ./scripts/build
      - name: Allow the emulator to use KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Verify SDK components and AVD lifecycle
        shell: bash
        run: bash ./scripts/test-android-linux
