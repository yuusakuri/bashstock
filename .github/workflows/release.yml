name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
        with:
          submodules: recursive

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libtime-hires-perl perl shellcheck

      - name: Validate the version tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'release: invalid version tag: %s\n' "$GITHUB_REF_NAME" >&2
            exit 64
          fi

      - name: Run all checks
        run: just verify

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/bashstock.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/bashstock.tar.gz \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --verify-tag
          fi

      - name: Attest the distribution
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4.2.2
        with:
          subject-path: dist/bashstock.tar.gz
