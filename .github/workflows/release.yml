name: Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
      RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}

    steps:
      - name: Check out the merged release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gawk libtime-hires-perl perl shellcheck

      - name: Run all checks
        run: just verify

      - name: Configure the release identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release publish "$RELEASE_COMMIT" --branch "$RELEASE_BRANCH"

      - name: Attest the distribution
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4.2.2
        with:
          subject-path: dist/bashstock.sh
